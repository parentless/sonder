[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
# whisper.cpp (speech to text) must not be tuned to the machine that builds it,
# or the released app could crash on an older processor.
GGML_NATIVE = "OFF"
# Sonder links the C runtime statically (below), so whisper.cpp has to as well,
# or Windows linking fails on mixed runtimes. The policy makes CMake honour it.
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded$<$<CONFIG:Debug>:Debug>"

# Ship a standalone Windows executable without a VC++ runtime installer.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
