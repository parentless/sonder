[package]
name = "cadence"
version = "0.8.23"
edition = "2024"
license = "MIT"
repository = "https://github.com/parentless/sonder"
description = "A native Rust and GPUI Spotify client for Windows and macOS"
rust-version = "1.97"

[dependencies]
fastrand = "2"
anyhow = "1.0"
async-channel = "2.5"
base64 = "0.22"
cpal = "0.18"
directories = "6.0"
env_logger = "0.11"
futures = "0.3"
gpui-kit = "0.7.0"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "4.1"
md-5 = "0.10"
librespot = { version = "0.8.0", default-features = false, features = ["native-tls"] }
raw-window-handle = "0.6"
oauth2 = { version = "5.0", default-features = false, features = ["reqwest", "native-tls"] }
oauth2-reqwest = { package = "reqwest", version = "0.12", default-features = false, features = ["native-tls"] }
open = "5.3"
rspotify = { version = "0.16.0", default-features = false, features = ["client-reqwest", "reqwest-native-tls"] }
# gpui-kit's HTTP client is built on this reqwest fork; sharing it keeps one build.
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls", "stream"] }
ringbuf = "0.5"
rubato = "5"
rust-embed = { version = "8", features = ["debug-embed"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5"
souvlaki = { version = "0.8.3", default-features = false }
log = "0.4.33"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
# librespot 0.8's build script is incompatible with vergen 9.1.
vergen = "=9.0.6"

[dev-dependencies]
gpui-kit = { version = "0.7.0", features = ["test-support"] }

[[test]]
name = "ui_rendering"
path = "src/ui_rendering.rs"
harness = false
test = false

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Keep Windows development executables independent of the build machine's files.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
# Upstream exits the process on a free account; this copy lets Cadence show a screen.
librespot-core = { path = "vendor/librespot-core" }
