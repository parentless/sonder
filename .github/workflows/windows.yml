name: Windows

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: The Cargo package version in the built executable
        value: ${{ jobs.windows.outputs.version }}

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CADENCE_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $toolchain = (Get-Content rust-toolchain.toml | Select-String '^channel = "(.+)"').Matches.Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component rustfmt,clippy
          rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'cadence').version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'A stable MAJOR.MINOR.PATCH version is required' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag must match the Cargo package version'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: cargo fmt --all --check
      - run: cargo build --locked --target x86_64-pc-windows-msvc
      - run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo test --locked --target x86_64-pc-windows-msvc
      # macOS image baselines are intentionally checked only in macOS CI.
      - name: Build optimized executable and embedded GPUI shaders
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package executable
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonder-windows-x86_64
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
