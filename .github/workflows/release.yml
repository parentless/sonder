name: Windows release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One publisher at a time; never cancel a release in the middle of publication.
concurrency:
  group: windows-publish
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  publish:
    needs: windows
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sonder-windows-x86_64
          path: dist
      - name: Publish a new version once
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing_draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$existing_draft" = "false" ]; then
            echo "Release $tag already exists. Optimized artifacts for this commit remain available in this workflow run."
            exit 0
          fi
          cd dist
          sha256sum --check ./*.sha256
          cd ..
          if [ "$existing_draft" = "true" ]; then
            gh release upload "$tag" dist/*.exe dist/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/*.exe dist/*.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Sonder $VERSION for Windows" --generate-notes --draft
          fi
          # The updater sees only complete releases, after all assets upload.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
